<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1115" />
    <title>Asmoday</title>
    <script>
      // 首屏防闪烁（设计文档 8.2）：在 CSS 生效前、早于 Vue 挂载就把主题写到 <html>。
      // 三态：light / dark / system（默认），system 走 matchMedia，不在本地存解析结果。
      ;(function () {
        var light = false
        try {
          var stored = localStorage.getItem('asmoday.theme')
          if (stored === 'light') light = true
          else if (stored === 'dark') light = false
          else light = !window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (e) {
          /* localStorage 不可用时跟随系统 */
          try {
            light = !window.matchMedia('(prefers-color-scheme: dark)').matches
          } catch (err) {
            light = false
          }
        }
        if (light) document.documentElement.setAttribute('data-theme', 'light')
        document.documentElement.style.colorScheme = light ? 'light' : 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
