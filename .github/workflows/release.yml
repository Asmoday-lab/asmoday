name: release

# 打 v* tag 即发版。产物三件：Windows x64、Linux x64（musl）、Linux arm64（musl）。
#
# 不再构建 macOS：macos-13 的队列常年缺货，两个 mac job 一卡住，整个矩阵就一直
# 停在 in_progress，后面 needs: build 的 release job 永远等不到 —— 表现是
# 「tag 打了、Actions 绿着，但 Releases 里啥也没有」。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_NAME: asmoday
  CARGO_TERM_COLOR: always

# 同一个 tag 改指向后重推时，旧 run 必须让位：两个 run 并发写同一份 release，
# 后到的产物会覆盖先到的，最后留下的是哪一份说不清。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: 独立构建前端产物（只跑一次，三个目标共用）
  # ==========================================
  prepare-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          # 你的 Vite 输出在项目根目录的 dist
          path: dist
          # 前端一定有产物；空的说明 build 静默失败了，早点炸掉好过发个白屏包
          if-no-files-found: error
          retention-days: 3

  # ==========================================
  # Job 2: 多平台后端构建与打包
  # ==========================================
  build:
    needs: prepare-frontend
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          # 下载到项目根目录的 dist，供 rust-embed 吸收
          path: dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # 每个 target 一份缓存：musl 与 msvc 的编译产物不能混着用
          key: ${{ matrix.target }}

      # Linux 环境统一使用 Zig 交叉编译
      - name: Install Zig & cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      # --locked：Cargo.lock 必须能锁住整棵依赖树，发版当天不能被上游悄悄升版本
      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 打包逻辑
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DIR="${APP_NAME}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/${APP_NAME}" "$DIR/"
          cp README.md "$DIR/" 2>/dev/null || true
          tar czf "${DIR}.tar.gz" "$DIR"

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $DIR = "${env:APP_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $DIR
          Copy-Item "target/${{ matrix.target }}/release/${env:APP_NAME}.exe" -Destination $DIR
          Copy-Item "README.md" -Destination $DIR -ErrorAction SilentlyContinue
          Compress-Archive -Path $DIR -DestinationPath "$DIR.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          overwrite: true
          if-no-files-found: error
          retention-days: 3

  # ==========================================
  # Job 3: 过滤产物并发布
  # ==========================================
  release:
    needs: build
    # 矩阵整体成功才发版：一个目标挂了就发半套产物，用户下到的是缺件版本
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. 将刚才所有构建产物拉下来
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      # 2. 精准提取（加容错逻辑，某个产物缺失不影响其余产物发布）
      - name: Select release assets
        run: |
          mkdir -p final_release

          cp dist/x86_64-pc-windows-msvc/asmoday-x86_64-pc-windows-msvc.zip final_release/ || true
          cp dist/x86_64-unknown-linux-musl/asmoday-x86_64-unknown-linux-musl.tar.gz final_release/ || true
          cp dist/aarch64-unknown-linux-musl/asmoday-aarch64-unknown-linux-musl.tar.gz final_release/ || true

          if [ -z "$(ls -A final_release)" ]; then
            echo "Error: 没有找到任何有效的发布产物！"
            exit 1
          fi

          echo "准备发布的文件如下："
          ls -la final_release/

      # 3. 发布。同 tag 重打时覆盖同名 release 的产物，不新开重复 entry。
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: final_release/*
          generate_release_notes: true
          overwrite_files: true
          # v0.1.0-alpha.1 这类带预发布后缀的 tag 自动标记为 prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
