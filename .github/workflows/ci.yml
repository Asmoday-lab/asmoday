name: CI

# 后端门禁：release.yml 只做交叉编译 build（musl/msvc target 无法在 runner 上直接运行），
# 从未跑过 cargo test —— 这意味着任何单元测试（包括端口占用回归）在 CI 里形同虚设。
# 本工作流在 Linux 宿主 target 上真正执行 fmt / clippy / test，
# 让 #[cfg(unix)] 的 socket option 回归测试也能跑到（Termux 端口误报复盘，2026-11-20）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend checks (fmt + clippy + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # rust-embed 的 #[folder = "dist/"] 要求该目录存在；测试不校验前端内容，
      # 放一个占位 index.html 即可，避免为跑后端测试而先构建整个前端。
      - name: Prepare dist placeholder
        run: mkdir -p dist && printf '<!doctype html><title>ci</title>' > dist/index.html

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets
