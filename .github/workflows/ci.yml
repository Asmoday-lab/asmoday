name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支连续推送时取消上一次：CI 只关心最新提交
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: backend (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 前端产物是编译期内嵌的（rust-embed），`dist/` 不存在会直接编译失败。
      # CI 的后端任务不构建前端（那是另一个 job），这里给个空目录占位。
      - name: Stub frontend dist
        run: mkdir -p dist

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
        env:
          RUST_BACKTRACE: 1

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 锁文件必须与 package.json 一致：本地漏跑 `pnpm install` 会在这里暴露，
      # 而不是等到发版时才炸
      - run: pnpm install --frozen-lockfile

      # build 里已经含 `vue-tsc -b`（类型检查），不需要单独一步
      - run: pnpm run build
