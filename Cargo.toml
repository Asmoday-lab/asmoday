[package]
name = "asmoday"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "sync", "time", "io-util", "signal"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 配置格式固定 TOML（红线：禁止 YAML）
toml = "0.8"
# 保留用户注释的原地改写：可视化表单保存时只改“值”，不重写整篇文档
# （toml 0.8 的 to_string_pretty 会丢掉全部注释 —— 红线 10 不允许）
toml_edit = "0.22"
# 按扩展名推断 Content-Type（本地查表，不联网）
mime_guess = "2"
# 单二进制：把前端产物内嵌进可执行文件
rust-embed = "8"
# ThumbHash：主色调模糊占位图（设计文档 3.4，纯本地计算）
thumbhash = "0.1"
# 本地 SQLite（bundled，无需系统依赖）
rusqlite = { version = "0.32", features = ["bundled"] }
# 密码哈希
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
# TOTP / Base32
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
rand = "0.9"
# 跨平台真实伪终端（ConPTY / openpty）
portable-pty = "0.8"
# 跨平台主目录解析（设计文档 6.3：path 为空时必须落 dirs::home_dir()，
# 不要自己读 USERPROFILE/HOME —— macOS/Linux 的规则并不一致）
dirs = "6"
# 缩略图解码/缩放（只处理静态图片；视频封面走外部可选 FFmpeg 截帧，不链接 libav*）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# 聚合服务反代。TLS 按目标平台分流（见文件末尾的两个 [target] 节）：
# - 非 Linux：native-tls → Windows 落 SChannel（保持「TLS 走系统实现」的设计）；
# - Linux（含 musl 交叉编译，见 9.3）：rustls —— native-tls 在 Linux 落到
#   openssl-sys，musl 环境没有 OpenSSL 可链，交叉编译直接失败。
# 基础依赖只放双方共有的 stream，TLS 特性放 target 节，避免特性并集把两边都拉进来。
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
tokio-tungstenite = "0.29"
# config.toml 热重载（设计文档 3.5：保存后无需重启进程）
notify = "8"
# 字幕编码探测：.srt 极大概率是 GBK，UTF-8 失败时用它兜底（设计文档 3.4.7 第 3 条）
encoding_rs = "0.8"
# WebDAV PROPFIND 的 RFC1123 时间格式（axum 内部同款，不新增传递依赖）
httpdate = "1"

# TLS 平台分流（注释见上方 reqwest）。必须放在 [dependencies] 全部键之后。
[target.'cfg(not(target_os = "linux"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

# 发布体积裁剪（见设计文档 9.1）
# Windows 下某些 MSVC 环境会在 C 依赖（SQLite / ring 等）上触发
# cl.exe D8050「无法把命令行放入调试记录」，关闭 dev 调试信息即可绕开。
[profile.dev]
debug = 0

# 控制台日志着色（设计文档 3.7）：经典 conhost 需要显式打开 ANSI VT 处理。
# 仅 Windows 平台、仅 Console 两个 feature，不引入其他 Win32 面。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
