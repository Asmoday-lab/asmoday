[package]
name = "asmoday"
version = "0.1.0"
edition = "2024"
# 下限来自 std 的文件锁（`File::try_lock`，1.89 稳定）：单实例锁靠它，
# 再低就得引第三方 crate 或退回 SQLite 排他锁的老路。
rust-version = "1.89"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "sync", "time", "io-util", "signal"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 配置格式固定 TOML（红线：禁止 YAML）
toml = "0.8"
# 保留用户注释的原地改写：可视化表单保存时只改“值”，不重写整篇文档
# （toml 0.8 的 to_string_pretty 会丢掉全部注释 —— 红线 10 不允许）
toml_edit = "0.22"
# 双栈监听：host = "::" 时显式关掉 IPV6_V6ONLY，Windows 默认只收 v6
# （tokio 自身已在依赖树里带 socket2，这里只是声明出来直接用）
socket2 = "0.6"
# 按扩展名推断 Content-Type（本地查表，不联网）
mime_guess = "2"
# 单二进制：把前端产物内嵌进可执行文件
rust-embed = "8"
# ThumbHash：主色调模糊占位图（设计文档 3.4，纯本地计算）
thumbhash = "0.1"
# 本地 SQLite（bundled，无需系统依赖）
rusqlite = { version = "0.32", features = ["bundled"] }
# schema 版本管理（`PRAGMA user_version`）。
# 原来是「CREATE TABLE IF NOT EXISTS + 一串忽略错误的 ALTER + 靠 table_has_column 猜」，
# 没有版本号：每次启动都重跑全部 DDL，加错一列也不会报错，升级顺序全靠代码顺序。
# 换成显式版本表之后，每步只跑一次，出问题能定位到具体版本。
# 1.3 是最后一个仍兼容 rusqlite 0.32 的版本（2.x 起要求 0.34+，而 0.34+ 会与
# 现有 bundled SQLite 的 `links = "sqlite3"` 打架）。API 上没有差别。
rusqlite_migration = "1.3"
# 密码哈希
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
# TOTP / Base32
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
rand = "0.9"
# 跨平台真实伪终端（ConPTY / openpty）
portable-pty = "0.8"
# 跨平台主目录解析（设计文档 6.3：path 为空时必须落 dirs::home_dir()，
# 不要自己读 USERPROFILE/HOME —— macOS/Linux 的规则并不一致）
dirs = "6"
# 缩略图解码/缩放（只处理静态图片；视频封面走外部可选 FFmpeg 截帧，不链接 libav*）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# 聚合服务反代。TLS 按目标平台分流（见文件末尾的两个 [target] 节）：
# - 非 Linux：native-tls → Windows 落 SChannel（保持「TLS 走系统实现」的设计）；
# - Linux（含 musl 交叉编译，见 9.3）：rustls —— native-tls 在 Linux 落到
#   openssl-sys，musl 环境没有 OpenSSL 可链，交叉编译直接失败。
# 基础依赖只放双方共有的 stream，TLS 特性放 target 节，避免特性并集把两边都拉进来。
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
tokio-tungstenite = "0.29"
# config.toml 热重载（设计文档 3.5：保存后无需重启进程）
notify = "8"
# 字幕编码探测：.srt 极大概率是 GBK，UTF-8 失败时用它兜底（设计文档 3.4.7 第 3 条）
encoding_rs = "0.8"
# WebDAV PROPFIND 的 RFC1123 时间格式（axum 内部同款，不新增传递依赖）
httpdate = "1"
# 把中间件包在 Router 外面需要用到 tower::Layer（axum 内部本来就用它，这里只是显式声明）
tower = "0.5"
# 传输层压缩（br 优先、gzip 兜底）。tower-http 本来就在 axum 的依赖树里，
# 这里只多开两个压缩特性，不引入第二份 tower-http。
# 自写 Content-Encoding 要自己处理分块、Vary、ETag 弱化、Content-Length 移除，
# 漏一个就是线上事故，交给社区实现更划算。
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip"] }
# tower-http 的 Predicate::should_compress 签名里带 http_body::Body，
# 实现自定义判定必须能写出这个 trait 路径（本来就在依赖树里）。
# 注意 crate 名带连字符、lib 名是 http_body
http-body = "1"
# 音频标签（ID3v2 / FLAC / Ogg / MP4 / WAV / AIFF / APE / WavPack）。
# 自己写 ID3v2 只能覆盖 MP3，FLAC 与 M4A 直接没标签（音乐库整页空白）。
lofty = "0.25.5"
# WebDAV 协议栈（RFC 4918 全套：PROPFIND / PROPPATCH / LOCK / COPY / MOVE /
# 多段 Range / ETag 条件请求），从 webdav-handler 分叉而来。
#
# 自研那版客户端实测加不上：`/dav`、`/dav/` 这种虚拟根直接 404，PROPFIND 又缺
# `getetag` / `creationdate` / `supportedlock`，目录 href 没有尾斜杠——这几样恰好
# 是客户端判断「能不能用」的判据。协议边角交给成熟实现，我们只留认证与安全边界。
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }
# dav-server 的 `DavFile::write_buf` 签名里要写 `Box<dyn bytes::Buf>`（本来就在依赖树里）
bytes = "1"

# TLS 平台分流（注释见上方 reqwest）。必须放在 [dependencies] 全部键之后。
[target.'cfg(not(target_os = "linux"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

# 发布体积裁剪（见设计文档 9.1）
# Windows 下某些 MSVC 环境会在 C 依赖（SQLite / ring 等）上触发
# cl.exe D8050「无法把命令行放入调试记录」，关闭 dev 调试信息即可绕开。
[profile.dev]
debug = 0

# 控制台日志着色（设计文档 3.7）：经典 conhost 需要显式打开 ANSI VT 处理。
# 仅 Windows 平台、仅 Console 两个 feature，不引入其他 Win32 面。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# 全局分配器（见 src/main.rs 的 #[global_allocator]）。
#
# 这个进程的活儿是「小块高频分配」：JSON、路径字符串、缩略图解码缓冲、PTY 分片。
# 系统分配器（Windows 的 LFH、glibc 的 ptmalloc）在跨线程 free 和碎片上都要付代价；
# mimalloc 针对这种场景做的分段 + 线程本地缓存，实测能把缩略图批量生成的尾延迟压下来。
#
# **musl 目标刻意排除**：musl 默认静态链接，mimalloc 依赖 pthread TLS，
# 交叉编译到 aarch64-unknown-linux-musl 时 TLS 模型对不上，会在运行时崩。
# 静态链接的场景本来就少一次堆竞争，用系统分配器没有明显损失。
[target.'cfg(not(target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
